<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070b1c" />
  <title>保羅西拉 · 在患難中讚美</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>
  <div id="rotate">請把手機轉成<br>橫向 ⟳ 來玩</div>
  <script type="module" src="main.js"></script>
    <script>
      // play-stats 三層匿名計數(lobby-play-rank §3/§4):開啟 10 分去重;-start/-done 不去重;-done 帶 t=秒。零個資。
      window.psPing = function (key, t) {
        try {
          // ⚠ 0813:原本是白名單 `if (!hostname.endsWith('netlify.app')) return;`——本站現在還在
          //   netlify 所以「剛好對得上」,但只要一遷 CF 就會像大廳一樣**瞬間斷流且零錯誤**
          //   (大廳 07-22 遷 CF 後統計從 15 次/天掉到 1~2 次/天,躺了三週沒人發現)。
          //   改用艦隊主流的黑名單:只擋本機開發,其餘一律放行 ⇒ 以後搬家不會再斷。
          if (['localhost', '127.0.0.1'].includes(location.hostname)) return;
          var u = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + key + (t ? '&t=' + t : '');
          if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u, { mode: 'no-cors' });
        } catch (_) {}
      };
      try {
        var psK = 'ps-last-paul-silas';
        var psLast = parseInt(localStorage.getItem(psK) || '0', 10);
        if (Date.now() - psLast > 600000) { localStorage.setItem(psK, String(Date.now())); window.psPing('paul-silas'); }
      } catch (_) { window.psPing('paul-silas'); }
    </script>

<script>
// ← 返回大廳(skill back-to-lobby-button):孩子卡住要能離開。DOM 疊在畫面上,不畫進 canvas。
// 退出 ≠ 過關:這裡只導頁,絕不呼叫 onComplete。嵌入時先讓宿主處理。
(function () {
  var LOBBY = 'https://hfpc-bible-games.summer09201017.workers.dev';
  function go() {
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
    if (window.parent && window.parent !== window) {          // 嵌入:交給宿主收掉關卡視窗
      try { window.parent.postMessage({ type: 'hfpc-exit' }, '*'); } catch (e) {}
      if (history.length > 1) { history.back(); return; }
    }
    location.href = LOBBY;
  }
  function add() {
    if (document.querySelector('[data-hfpc-lobby]')) return;
    var b = document.createElement('button');
    b.textContent = '← 返回大廳';
    b.setAttribute('aria-label', '返回大廳');
    b.setAttribute('data-hfpc-lobby', '1');
    b.style.cssText = 'position:fixed;z-index:2147483000;' +
      'top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));' +
      'min-width:44px;min-height:44px;padding:9px 14px;border:0;border-radius:12px;' +
      'font:600 15px/1.2 system-ui,"Microsoft JhengHei",sans-serif;' +
      'background:rgba(0,0,0,.58);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent';
    b.addEventListener('click', go);
    (document.body || document.documentElement).appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', add); else add();
})();
</script>

<script>
// 真實停留打點(skill play-stats-dwell):開頁到離開,單發 paul-silas-dwell。
// ★ 只送這一發:手機鎖屏時常只送得出佇列第一個 beacon,同一刻連發兩個會有一發被丟掉。
(function () {
  var SITE = 'paul-silas', t0 = Date.now(), sent = false;
  function bye() {
    if (sent) return; sent = true;
    var sec = Math.round((Date.now() - t0) / 1000);
    if (sec < 3 || sec > 1800) return;                     // 誤觸不算、掛整天的背景分頁不算
    if (['localhost', '127.0.0.1', ''].indexOf(location.hostname) >= 0) return;
    try {
      navigator.sendBeacon &&
        navigator.sendBeacon('https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + SITE + '-dwell&t=' + sec);
    } catch (e) {}
  }
  addEventListener('pagehide', bye);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') bye(); });
})();
</script>

<script>
// 🎵 背景音樂(BGM 百曲庫 0726,skill procedural-bgm):零音檔 Web Audio。
// 曲子由站名雜湊決定=全艦隊每站不同首;有關卡的遊戲可呼叫 window.hfpcBgmLevel(n) 換曲。
// 音域 330Hz+/音量經 AnalyserNode 校正(手機喇叭放不出 500Hz 以下——0726 實測)。
(function () {
  var SITE = 'hfpc-paul-silas-game';
  var muted = false; try { muted = localStorage.getItem('bgm-muted') === '1'; } catch (e) {}
  var ctx = null, timer = 0, step = 0, cur = null, started = false;
  function variant(lv) {
    var SC = [[523.25,587.33,659.25,783.99,880],[440,523.25,587.33,659.25,783.99],[392,440,493.88,587.33,659.25],[349.23,392,440,523.25,587.33],[587.33,659.25,739.99,880,987.77],[329.63,392,440,493.88,587.33],[466.16,523.25,587.33,698.46,783.99],[415.3,466.16,554.37,622.25,739.99]];
    var PT = [[0,1,2,3,4,3,2,1],[0,2,4,2,1,3,2,0],[4,3,2,1,0,1,2,3],[0,0,2,2,4,4,2,-1],[0,2,1,3,2,4,3,-1],[4,2,0,2,4,2,1,0],[0,3,1,4,2,0,3,-1],[2,4,2,0,1,3,4,2]];
    var x = 2166136261, s = SITE + '|' + (lv || 1);
    for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0 }
    var mul = [1, 1.122, 0.891][(x >>> 13) % 3];
    var sc = SC[x % 8].map(function (f) { return f * mul });
    var p = PT[(x >>> 3) % 8].concat(PT[(x >>> 6) % 8]);
    var wave = ['triangle', 'square', 'sine'][(x >>> 11) % 3];
    return { mel: p.map(function (i) { return i < 0 ? 0 : sc[i] }),
             bass: [0,0,3,3,4,4,3,3,0,0,3,3,4,4,0,0].map(function (i) { return sc[i] / 2 }),
             wave: wave, vol: wave === 'square' ? 0.2 : wave === 'sine' ? 0.42 : 0.32,
             ms: [190, 220, 250, 290][(x >>> 9) % 4] };
  }
  function blip(f, dur, type, vol) {
    if (muted || !ctx) return;
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + dur + 0.02);
    } catch (e) {}
  }
  function tick() {
    if (muted || !cur) return;
    var i = step % 16;
    if (cur.bass[i]) blip(cur.bass[i], cur.ms / 1000 * 1.8, 'sine', 0.02);
    if (step % 2 === 0) { var mf = cur.mel[(step / 2) % 16 | 0]; if (mf) blip(mf, cur.ms / 1000 * 1.7, cur.wave, cur.vol); }
    step++;
  }
  window.hfpcBgmLevel = function (lv) { cur = variant(lv); step = 0; if (timer) { clearInterval(timer); timer = setInterval(tick, cur.ms); } };
  function start() {
    if (started || muted) return; started = true;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    cur = cur || variant(1);
    timer = setInterval(tick, cur.ms);
  }
  addEventListener('pointerdown', function () { start(); try { if (ctx && ctx.state === 'suspended') ctx.resume(); } catch (e) {} }, { passive: true });
  document.addEventListener('visibilitychange', function () { if (!ctx) return; try { document.hidden ? ctx.suspend() : ctx.resume(); } catch (e) {} });
  // 🎵 靜音鈕(放「← 返回大廳」鈕下方,同一套視覺)
  function addBtn() {
    if (document.querySelector('[data-hfpc-bgm]')) return;
    var b = document.createElement('button');
    b.textContent = muted ? '🔇' : '🎵';
    b.setAttribute('aria-label', '開關背景音樂');
    b.setAttribute('data-hfpc-bgm', '1');
    b.style.cssText = 'position:fixed;z-index:2147483000;' +
      'top:calc(60px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));' +
      'min-width:44px;min-height:44px;border:0;border-radius:12px;font-size:17px;' +
      'background:rgba(0,0,0,.58);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent';
    b.addEventListener('click', function () {
      muted = !muted;
      try { localStorage.setItem('bgm-muted', muted ? '1' : '0'); } catch (e) {}
      b.textContent = muted ? '🔇' : '🎵';
      if (!muted) start();
    });
    (document.body || document.documentElement).appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addBtn); else addBtn();
})();
</script>
</body>
</html>
